name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          pip install pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Hook tests
        run: |
          for test in hooks/tests/test_*.sh; do
            echo "Running $test"
            bash "$test"
          done

      - name: Python tool tests
        run: python3 -m pytest tests/ -v --tb=short

      - name: Contract JSON validation
        run: |
          python3 -c "
          import json, glob, sys
          errors = [f for f in glob.glob('contracts/*.json') if not json.loads(open(f).read())]
          sys.exit(1) if errors else print('All contracts valid')
          "

      - name: Bootstrap syntax check
        run: bash -n bootstrap.sh && echo "bootstrap.sh syntax OK"
